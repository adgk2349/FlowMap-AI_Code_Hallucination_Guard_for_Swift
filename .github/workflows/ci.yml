name: CI

on:
  push:
    branches: [main, "flowmap-pr*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build Rust engine
        run: cargo build

      - name: Build Swift AST parser
        run: |
          cd parsers/swift-ast
          swift build -c release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Lint VS Code Extension
        run: |
          cd editor/vscode
          npm ci
          npm run compile
          npm run lint
