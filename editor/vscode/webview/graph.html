<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src {{CSP_SOURCE}}; style-src 'unsafe-inline';"
    />
    <title>FlowMap Graph</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #1e1e1e;
        overflow: hidden;
      }
      #cy {
        position: absolute;
        inset: 0;
      }
      #legend {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(30, 30, 30, 0.88);
        border: 1px solid #444;
        border-radius: 6px;
        padding: 10px 12px;
        min-width: 130px;
        pointer-events: none;
        z-index: 10;
      }
      #legend-title {
        font-size: 11px;
        font-weight: bold;
        color: #aaa;
        margin-bottom: 7px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="cy"></div>
    <div id="legend">
      <div id="legend-title">LEGEND</div>
    </div>
    <script type="application/json" id="graph-data">{{GRAPH_DATA}}</script>
    <script src="{{CY_JS_URI}}"></script>
    <script src="{{GRAPH_JS_URI}}"></script>
  </body>
</html>
