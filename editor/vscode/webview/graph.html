<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src {{CSP_SOURCE}} https://unpkg.com; style-src 'unsafe-inline';"
    />
    <title>FlowMap Graph</title>
    <style>
      html,
      body,
      #cy {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #1e1e1e;
      }
    </style>
  </head>
  <body>
    <div id="cy"></div>
    <script type="application/json" id="graph-data">{{GRAPH_DATA}}</script>
    <script src="https://unpkg.com/cytoscape@3.29.2/dist/cytoscape.min.js"></script>
    <script src="{{GRAPH_JS_URI}}"></script>
  </body>
</html>
