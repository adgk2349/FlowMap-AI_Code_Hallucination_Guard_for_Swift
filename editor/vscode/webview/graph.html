<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src {{CSP_SOURCE}}; style-src 'unsafe-inline';"
    />
    <title>FlowMap Graph</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0f1117;
        overflow: hidden;
      }
      #cy {
        position: absolute;
        inset: 0;
        background: #0f1117;
      }
      /* ── Empty state overlay ────────────────────────────────────────────── */
      #empty-state {
        display: none; /* shown by JS when no file nodes exist */
        position: absolute;
        inset: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #555566;
        font-size: 14px;
        pointer-events: none;
        z-index: 5;
        gap: 12px;
      }
      /* Analyze Workspace button — shown only when no analysis exists yet */
      .analyze-btn {
        display: none; /* revealed by showAnalyzePrompt() in graph.js */
        background: rgba(77, 163, 255, 0.15);
        border: 1px solid #4da3ff;
        border-radius: 4px;
        color: #4da3ff;
        font-size: 12px;
        padding: 6px 18px;
        cursor: pointer;
        font-family: inherit;
        pointer-events: auto; /* override parent's pointer-events: none */
        transition: background 0.15s, color 0.15s;
      }
      .analyze-btn:hover {
        background: rgba(77, 163, 255, 0.30);
        color: #c8d8ff;
      }
      /* ── Toolbar (search + layout buttons) ─────────────────────────────── */
      #toolbar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        align-items: center;
        background: rgba(12, 14, 20, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 3px 7px;
        z-index: 10;
        pointer-events: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.40);
      }
      #toolbar input[type='text'] {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        color: #b8c8e0;
        font-size: 10px;
        padding: 2px 8px;
        width: 128px;
        outline: none;
        font-family: inherit;
        transition: border-color 0.15s;
      }
      #toolbar input[type='text']:focus {
        border-color: rgba(77, 163, 255, 0.55);
        background: rgba(77, 163, 255, 0.06);
      }
      #toolbar input[type='text']::placeholder {
        color: #444458;
      }
      #toolbar button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 4px;
        color: #8898aa;
        font-size: 10px;
        padding: 2px 9px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.12s, color 0.12s, border-color 0.12s;
        letter-spacing: 0.01em;
      }
      #toolbar button:hover {
        background: rgba(77, 163, 255, 0.14);
        color: #c0d4f0;
        border-color: rgba(77, 163, 255, 0.38);
      }
      #toolbar button:active {
        background: rgba(77, 163, 255, 0.22);
      }
      /* ── Legend ─────────────────────────────────────────────────────────── */
      /* top: 48px leaves enough gap below the toolbar (≈30px tall) */
      #legend {
        position: absolute;
        top: 48px;
        right: 12px;
        background: rgba(12, 14, 20, 0.90);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 6px;
        padding: 6px 9px;
        min-width: 108px;
        pointer-events: none;
        z-index: 10;
      }
      #legend-title {
        font-size: 9px;
        font-weight: 600;
        color: #445;
        margin-bottom: 5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      /* ── Detail mode header (file name context, shown below toolbar) ────── */
      #detail-header {
        display: none;
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        color: #8899bb;
        font-size: 11px;
        font-weight: 500;
        pointer-events: none;
        z-index: 10;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 60%;
        text-align: center;
        letter-spacing: 0.02em;
      }
      /* ── Node tooltip (full label on hover for truncated labels) ─────────── */
      #cy-tooltip {
        display: none;
        position: fixed;
        background: rgba(15, 17, 23, 0.97);
        border: 1px solid #3a3a4a;
        border-radius: 4px;
        color: #c8d0e0;
        font-size: 10px;
        padding: 3px 8px;
        pointer-events: none;
        z-index: 200;
        white-space: nowrap;
      }
      /* ── Status badge (top-left) ────────────────────────────────────────── */
      #status-badge {
        position: absolute;
        top: 10px;
        left: 12px;
        padding: 4px 9px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 600;
        pointer-events: none;
        z-index: 10;
        line-height: 1.5;
        display: none;
      }
      #status-badge.status-clean {
        background: rgba(20, 45, 20, 0.90);
        color: #55aa55;
        border: 1px solid rgba(50, 120, 50, 0.50);
      }
      #status-badge.status-changed {
        background: rgba(50, 32, 8, 0.90);
        color: #c89040;
        border: 1px solid rgba(120, 80, 20, 0.50);
      }
      #status-badge .badge-counts {
        font-size: 9px;
        font-weight: normal;
        color: #a07838;
        display: block;
        margin-top: 2px;
      }
      /* ── License badge (bottom-right) ───────────────────────────────────── */
      #license-badge {
        position: absolute;
        bottom: 12px;
        right: 12px;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 9px;
        font-weight: 500;
        pointer-events: none;
        z-index: 10;
        opacity: 0.50;
      }
      #license-badge.license-free {
        background: rgba(20, 20, 20, 0.70);
        color: #66667a;
        border: 1px solid rgba(70, 70, 80, 0.35);
      }
      #license-badge.license-pro {
        background: rgba(15, 28, 60, 0.80);
        color: #5088e0;
        border: 1px solid rgba(50, 100, 200, 0.40);
      }
    </style>
  </head>
  <body>
    <div id="cy"></div>
    <!-- Empty state: shown when no file nodes exist or no analysis has run yet -->
    <div id="empty-state">
      <span id="empty-msg">No Swift files found in this workspace.</span>
      <button id="btn-analyze" class="analyze-btn">Analyze Workspace</button>
    </div>
    <div id="status-badge"></div>
    <div id="license-badge"></div>
    <!-- Toolbar: search + layout switcher buttons (top-centre) -->
    <div id="toolbar">
      <button id="btn-back" style="display:none;">← Back</button>
      <input type="text" id="search-input" placeholder="Search nodes…" />
      <button id="btn-overview">Overview</button>
      <button id="btn-calls">Calls</button>
      <button id="btn-fit">Fit</button>
    </div>
    <!-- Detail mode context: file name shown below toolbar in file-detail mode -->
    <div id="detail-header"></div>
    <!-- Legend: top-right, positioned below toolbar so they don't overlap -->
    <div id="legend">
      <div id="legend-title">LEGEND</div>
    </div>
    <!-- Tooltip: full label on hover for truncated node labels -->
    <div id="cy-tooltip"></div>
    <script type="application/json" id="graph-data">{{GRAPH_DATA}}</script>
    <script src="{{CY_JS_URI}}"></script>
    <script src="{{GRAPH_JS_URI}}"></script>
  </body>
</html>
