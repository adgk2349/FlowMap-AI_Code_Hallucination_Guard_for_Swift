<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src {{CSP_SOURCE}}; style-src 'unsafe-inline';"
    />
    <title>FlowMap Graph</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0f1117;
        overflow: hidden;
      }
      #cy {
        position: absolute;
        inset: 0;
        background: #0f1117;
      }
      /* ── Toolbar (search + layout buttons) ────────────────────────────── */
      #toolbar {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        align-items: center;
        background: rgba(15, 17, 23, 0.92);
        border: 1px solid #3a3a4a;
        border-radius: 6px;
        padding: 5px 10px;
        z-index: 10;
        pointer-events: auto;
      }
      #toolbar input[type='text'] {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid #3a3a4a;
        border-radius: 4px;
        color: #c0c0d0;
        font-size: 11px;
        padding: 3px 8px;
        width: 140px;
        outline: none;
        font-family: inherit;
      }
      #toolbar input[type='text']:focus {
        border-color: #4da3ff;
      }
      #toolbar input[type='text']::placeholder {
        color: #555566;
      }
      #toolbar button {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid #3a3a4a;
        border-radius: 4px;
        color: #a0a0b0;
        font-size: 11px;
        padding: 3px 10px;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      #toolbar button:hover {
        background: rgba(77, 163, 255, 0.15);
        color: #c8d8f0;
        border-color: #4da3ff;
      }
      /* ── Legend ────────────────────────────────────────────────────────── */
      #legend {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(15, 17, 23, 0.88);
        border: 1px solid #3a3a4a;
        border-radius: 6px;
        padding: 10px 12px;
        min-width: 130px;
        pointer-events: none;
        z-index: 10;
      }
      #legend-title {
        font-size: 11px;
        font-weight: bold;
        color: #aaa;
        margin-bottom: 7px;
        letter-spacing: 0.04em;
      }
      /* ── Status badge (top-left) ────────────────────────────────────────── */
      #status-badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
        pointer-events: none;
        z-index: 10;
        line-height: 1.5;
        display: none;
      }
      #status-badge.status-clean {
        background: rgba(26, 60, 26, 0.90);
        color: #66cc66;
        border: 1px solid #2a7a2a;
      }
      #status-badge.status-changed {
        background: rgba(60, 40, 10, 0.90);
        color: #e0a050;
        border: 1px solid #7a5a1a;
      }
      #status-badge .badge-counts {
        font-size: 10px;
        font-weight: normal;
        color: #c8a070;
        display: block;
        margin-top: 2px;
      }
      /* ── License badge (bottom-right) ───────────────────────────────────── */
      #license-badge {
        position: absolute;
        bottom: 12px;
        right: 12px;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: bold;
        pointer-events: none;
        z-index: 10;
        opacity: 0.75;
      }
      #license-badge.license-free {
        background: rgba(30, 30, 30, 0.80);
        color: #888888;
        border: 1px solid #444444;
      }
      #license-badge.license-pro {
        background: rgba(20, 40, 80, 0.90);
        color: #66aaff;
        border: 1px solid #3366cc;
      }
    </style>
  </head>
  <body>
    <div id="cy"></div>
    <div id="status-badge"></div>
    <div id="license-badge"></div>
    <!-- Toolbar: search + layout switcher buttons -->
    <div id="toolbar">
      <input type="text" id="search-input" placeholder="Search nodes…" />
      <button id="btn-grid">Grid</button>
      <button id="btn-calls">Calls</button>
      <button id="btn-fit">Fit</button>
    </div>
    <div id="legend">
      <div id="legend-title">LEGEND</div>
    </div>
    <script type="application/json" id="graph-data">{{GRAPH_DATA}}</script>
    <script src="{{CY_JS_URI}}"></script>
    <script src="{{GRAPH_JS_URI}}"></script>
  </body>
</html>
